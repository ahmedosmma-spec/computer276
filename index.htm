<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
  <!-- أيقونة الموقع في المتصفح -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<!-- صورة المعاينة عند مشاركة الرابط على الواتساب أو السوشيال ميديا -->
<meta property="og:image" content="https://computer276.vercel.app/logo.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[$ مصروفاتي ]</title>

<!-- استدعاء خط عربي احترافي يماثل الرسم اليدوي -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  user-select: none;
}
:root {
  --accent-color: #69e0b1;
  --text-color: #ffffff;
}

body {
  margin: 0;
  padding: 20px 20px 110px 20px;
  background: linear-gradient(135deg, #182848, #29b6f6);
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: var(--text-color);
  font-family: 'Changa', sans-serif;
  min-height: 100vh;
  transition: background 0.4s ease;
}

.container {
  max-width: 500px;
  margin: auto;
}
/* تصميم كروت الليكود جلاس (Liquid Glass) الحقيقي والدقيق */
.card {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(25px) saturate(200%);
  -webkit-backdrop-filter: blur(25px) saturate(200%);
  padding: 20px;
  border-radius: 28px;
  margin-bottom: 20px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow: 
    0 20px 40px rgba(0, 0, 0, 0.25),
    inset 0 1px 1px rgba(255, 255, 255, 0.6),
    inset 0 -1px 2px rgba(0, 0, 0, 0.2);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 40%;
  background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
  pointer-events: none;
  border-radius: 28px 28px 0 0;
}

.app-header {
  text-align: center;
  margin-bottom: 25px;
}

.app-title {
  font-size: 38px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #ffffff;
  text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  display: inline-block;
}
.sub-title {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.85);
  margin-top: -5px;
}

.total-box {
  text-align: center;
  padding: 10px 0;
}

.total-spent {
  font-size: 34px;
  font-weight: 800;
  color: #ff6b6b;
  text-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
}

.total-income {
  font-size: 26px;
  font-weight: 700;
  color: var(--accent-color);
  text-shadow: 0 2px 10px rgba(105, 224, 177, 0.3);
  margin-top: 5px;
}

label {
  display: block;
  margin: 10px 0 4px 0;
  font-size: 15px;
  font-weight: 600;
}

input, select, button {
  width: 100%;
  padding: 12px 16px;
  margin: 6px 0;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  font-size: 15px;
  font-family: 'Changa', sans-serif;
  outline: none;
  background: rgba(0, 0, 0, 0.2);
  color: white;
  backdrop-filter: blur(10px);
}
input::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

input:focus, select:focus {
  border-color: var(--accent-color);
  box-shadow: 0 0 12px rgba(105, 224, 177, 0.4);
}

button {
  background: var(--accent-color);
  color: #0b1c16;
  font-weight: 700;
  cursor: pointer;
  border: none;
  margin-top: 12px;
  box-shadow: 0 6px 20px rgba(105, 224, 177, 0.35);
  transition: transform 0.1s ease;
}

button:active {
  transform: scale(0.97);
}

.radio-group {
  display: flex;
  gap: 15px;
  margin: 8px 0;
}

.radio-item {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 14px;
}

.radio-item input[type="radio"] {
  width: auto;
  margin: 0;
  accent-color: var(--accent-color);
}
.map-container {
  width: 100%;
  height: 140px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=600&q=80') center/cover;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  margin-top: 10px;
}

.expense-item {
  background: rgba(0, 0, 0, 0.25);
  padding: 12px 16px;
  border-radius: 16px;
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.btn-del {
  background: #ff5252;
  color: white;
  width: auto;
  padding: 4px 12px;
  font-size: 12px;
  margin: 0;
  box-shadow: none;
}

.page { display: none; }
.page.active { display: block; }
/* الشريط السفلي بتصميم ليكود جلاس */
.bottom-nav {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(30px) saturate(200%);
  -webkit-backdrop-filter: blur(30px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 35px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 6px 12px;
  width: calc(100% - 40px);
  max-width: 420px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
  z-index: 9999;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: rgba(255, 255, 255, 0.7);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 22px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.nav-item.active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.25);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.5);
}

.nav-item svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  margin-bottom: 2px;
}
</style>
</head>
<body>
<div class="container">

  <!-- صفحة مصروفاتي -->
  <div id="page-home" class="page active">
    <div class="app-header">
      <div class="app-title">[$ مصروفاتي ]</div>
      <div class="sub-title">أملك (امسك)</div>
    </div>

    <div class="card">
      <div class="total-box">
        <label>إجمالي ما تم صرفه</label>
        <div class="total-spent" id="totalSpent">- 2,180.0</div>
        <label style="margin-top: 10px;">إجمالي المدفوعات</label>
        <div class="total-income" id="totalIncome">+ 5,100.0</div>
      </div>
    </div>

    <div class="card">
      <form id="expenseForm">
        <label for="name">الإدخال : ها الاسم ؟ مثلاً : بيتزا</label>
        <input id="name" type="text" placeholder="اسم المصروف" required>

        <label for="amount">السعر مثل : 500 ج.م</label>
        <input id="amount" type="number" step="0.01" placeholder="السعر" required>

        <label for="date">التاريخ مثل : 2026/9/8</label>
        <input id="date" type="date" required>

        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="timeFilter" value="before" checked> قبل اليوم</label>
          <label class="radio-item"><input type="radio" name="timeFilter" value="today"> اليوم</label>
        </div>

        <button type="submit">تسجيل المصروف</button>
      </form>
    </div>
    <div class="card">
      <label for="category">نوع المنتج / المصروف</label>
      <select id="category">
        <option value="طعام">طعام</option>
        <option value="أدوية">أدوية</option>
        <option value="مستلزمات">مستلزمات</option>
        <option value="ألعاب">ألعاب</option>
        <option value="ملابس">ملابس</option>
        <option value="فواتير">فواتير</option>
      </select>

      <label style="margin-top: 15px;">إضافة موقع</label>
      <div class="map-container">
        <span></span>
      </div>
    </div>

    <div class="card">
      <label>سجل العمليات</label>
      <div id="list"></div>
    </div>
  </div>
  <!-- صفحة أنا -->
  <div id="page-profile" class="page">
    <div class="app-header">
      <div class="app-title">أنا</div>
    </div>

    <div class="card" style="text-align: center;">
      <div style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid white; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center;">
        <svg style="width: 45px; height: 45px; fill: white;" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>

      <div style="text-align: right;">
        <label>الاسم :</label>
        <input type="text" id="profName" value="مستخدم مميز">

        <label>الإيميل :</label>
        <input type="email" id="profEmail" value="user@mail.com">

        <label>العنوان (اختياري) :</label>
        <input type="text" id="profAddress" placeholder="ادخل العنوان">

        <button type="button" onclick="saveProfile()">حفظ البيانات</button>
      </div>
    </div>

    <div class="card">
      <label style="font-size: 18px; font-weight: 700;">نصائح تفيدنا</label>
      <p style="color: rgba(255,255,255,0.85); line-height: 1.7; margin-top: 8px;">
        • حافظ على تسجيل المصروفات أولاً بأول.<br>
        • تتبع البنود الأكثر استهلاكاً للميزانية شهرية.
      </p>
    </div>
  </div>
  <!-- صفحة الإعدادات -->
  <div id="page-settings" class="page">
    <div class="app-header">
      <div class="app-title">الإعدادات</div>
    </div>

    <div class="card">
      <label>الواجهة :</label>
      <div class="radio-group" style="flex-wrap: wrap;">
        <label class="radio-item"><input type="radio" name="themeBg" value="blue" checked onclick="setBg('blue')"> أزرق</label>
        <label class="radio-item"><input type="radio" name="themeBg" value="purple" onclick="setBg('purple')"> بنفسجي</label>
        <label class="radio-item"><input type="radio" name="themeBg" value="white" onclick="setBg('dark')"> أبيض/داكن</label>
        <label class="radio-item"><input type="radio" name="themeBg" value="custom" onclick="setBg('custom')"> صورة خاصة</label>
      </div>

      <label style="margin-top: 15px;">ستايل الواجهة :</label>
      <div class="radio-group">
        <label class="radio-item"><input type="radio" name="uiStyle" value="mowakb" checked> مريح</label>
        <label class="radio-item"><input type="radio" name="uiStyle" value="compact"> مختصر</label>
      </div>

      <label style="margin-top: 15px;">اللغة :</label>
      <div class="radio-group">
        <label class="radio-item"><input type="radio" name="lang" value="ar" checked> عربية</label>
        <label class="radio-item"><input type="radio" name="lang" value="device"> لغة الجهاز</label>
        <label class="radio-item"><input type="radio" name="lang" value="en"> انجليزي</label>
      </div>

      <label style="margin-top: 15px;" class="radio-item">
        <input type="checkbox" id="glassEffectCheck" checked> تأثير زجاجي
      </label>
    </div>
  </div>

</div>
<!-- الشريط السفلي التنقلي (مماثل للرسمة اليدوية بالكامل) -->
<div class="bottom-nav">
  <div class="nav-item active" data-page="page-home">
    <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1H3.8c.15 2.19 1.76 3.42 3.7 3.86V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
    <span>مصروفاتي</span>
  </div>
  <div class="nav-item" data-page="page-profile">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <span>أنا</span>
  </div>
  <div class="nav-item" data-page="page-settings">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></svg>
    <span>الإعدادات</span>
  </div>
</div>
<script>
const STORAGE_KEY = "masrofaty_strict_v1";

let expenses = [];

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  expenses = saved ? JSON.parse(saved) : [];
} catch (e) { expenses = []; }

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
document.getElementById("date").value = today();

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    return true;
  } catch (e) { return false; }
}

function setBg(type) {
  if (type === 'blue') {
    document.body.style.background = 'linear-gradient(135deg, #182848, #29b6f6)';
  } else if (type === 'purple') {
    document.body.style.background = 'linear-gradient(135deg, #200122, #6f0000)';
  } else if (type === 'dark') {
    document.body.style.background = '#101827';
  }
}
function render() {
  const list = document.getElementById("list");
  const totalSpentEl = document.getElementById("totalSpent");
  
  const total = expenses.reduce((sum, item) => sum + Number(item.amount), 0);
  totalSpentEl.textContent = "- " + total.toLocaleString('ar-EG') + " ج.م";

  list.replaceChildren();

  if (expenses.length === 0) {
    const empty = document.createElement("p");
    empty.style.textAlign = "center";
    empty.style.color = "rgba(255,255,255,0.6)";
    empty.textContent = "لا يوجد مصروفات مسجلة.";
    list.appendChild(empty);
    return;
  }

  expenses.slice().reverse().forEach(item => {
    const box = document.createElement("div"); box.className = "expense-item";
    const info = document.createElement("div");
    const name = document.createElement("div"); name.style.fontWeight = "700"; name.textContent = item.name;
    const details = document.createElement("small"); details.style.color = "rgba(255,255,255,0.7)"; details.textContent = item.category + " | " + item.date;
    info.append(name, details);
    
    const right = document.createElement("div");
    right.style.textAlign = "left";
    const amount = document.createElement("div"); amount.style.color = "#ff6b6b"; amount.style.fontWeight = "700"; amount.textContent = "- " + Number(item.amount).toLocaleString('ar-EG') + " ج.م";
    const del = document.createElement("button"); del.className = "btn-del"; del.textContent = "حذف";
    del.addEventListener("click", () => {
      expenses = expenses.filter(expense => expense.id !== item.id);
      saveData();
      render();
    });
    right.append(amount, del); box.append(info, right); list.appendChild(box);
  });
}
// التنقل بين الصفحات
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    item.classList.add('active');
    document.getElementById(item.getAttribute('data-page')).classList.add('active');
  });
});

function saveProfile() {
  const name = document.getElementById('profName').value;
  const email = document.getElementById('profEmail').value;
  const address = document.getElementById('profAddress').value;
  localStorage.setItem('masrofaty_prof_strict', JSON.stringify({ name, email, address }));
  alert("تم حفظ البيانات بنجاح!");
}

function loadProfile() {
  const saved = localStorage.getItem('masrofaty_prof_strict');
  if (saved) {
    const data = JSON.parse(saved);
    if(data.name) document.getElementById('profName').value = data.name;
    if(data.email) document.getElementById('profEmail').value = data.email;
    if(data.address) document.getElementById('profAddress').value = data.address;
  }
}
const form = document.getElementById("expenseForm");
form.addEventListener("submit", function(event) {
  event.preventDefault();
  const name = document.getElementById("name").value.trim();
  const amount = Number(document.getElementById("amount").value);
  const category = document.getElementById("category").value;
  const date = document.getElementById("date").value;

  if (!name || amount <= 0 || !date) return;

  const expense = { id: Date.now(), name, amount, category, date };
  expenses.push(expense);
  saveData();
  form.reset();
  document.getElementById("date").value = today();
  render();
});

loadProfile();
render();
</script>
</body>
</html>
