name: Build APK

# يشتغل فقط لما تضغط Run workflow يدويًا
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          mkdir -p "$RUNNER_TEMP/app/www"
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/app/www/" || echo "missing $f"
          done
          cd "$RUNNER_TEMP/app"
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.wazn.app","appName":"WAZN","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          pip install pillow
          cd "$RUNNER_TEMP/app/android/app/src/main/res"
          rm -rf mipmap-anydpi-v26
          python3 - <<PY
          from PIL import Image
          import os
          src = Image.open(os.path.join(os.environ["GITHUB_WORKSPACE"], "icon-512.png")).convert("RGB")
          for d, s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              p = "mipmap-" + d
              os.makedirs(p, exist_ok=True)
              im = src.resize((s, s), Image.LANCZOS)
              im.save(p + "/ic_launcher.png")
              im.save(p + "/ic_launcher_round.png")
          PY

      - name: Build APK
        run: |
          cd "$RUNNER_TEMP/app/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save APK to repository
        run: |
          cp "$RUNNER_TEMP/app/android/app/build/outputs/apk/debug/app-debug.apk" WAZN.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add WAZN.apk
          git commit -m "Build WAZN.apk" || echo "no changes"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: WAZN-apk
          path: WAZN.apk
